[NasServer]
IP = 0.0.0.0 # bind address
Port = 9000 # TCP listen port
SvcHost = dls1.nintendowifi.net # hostname returned for NAS service location

[GameSpyQRServer]
IP = 0.0.0.0 # bind address
Port = 27900 # UDP listen port
RewriteDolphinLocalIP = true # rewrite Dolphin localip0=10.0.1.30 to UDP source; set false on a public VPS

[GameSpyNatNegServer]
IP = 0.0.0.0 # bind address
Port = 27901 # UDP listen port

[GameSpyServerBrowserServer]
IP = 0.0.0.0 # bind address
Port = 28910 # TCP listen port

[GameSpyProfileServer]
IP = 0.0.0.0 # bind address
Port = 29900 # TCP listen port

[GameSpyPlayerSearchServer]
IP = 0.0.0.0 # bind address
Port = 29901 # TCP listen port

[Store]
Type = "json" # "json"
Path = "data" # JSON data directory

[Logging]
Timestamps = true # prefix lines with date/time
Level = info # debug | info | warn | error
Color = auto # auto | always | never
Nas = true # NAS HTTP server logs
Profile = true # GPCM profile server logs
Gpsp = true # GPSP player search logs
Qr = true # QR / master server logs
Browser = true # server browser logs
Natneg = true # NAT negotiation logs
Proxy = true # reverse proxy logs
App = true # startup and lifecycle logs
LogFile = # mirror of stderr INFO/WARN/ERROR lines; empty to disable
DumpFile = # raw NAS/proxy TCP dumps (recv/send/accept); empty to disable
